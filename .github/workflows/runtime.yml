name: Runtime (Rust)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in runtime/rust-toolchain.toml (preinstalled rustup, no third-party action)
        run: |
          rustup toolchain install
          rustup show active-toolchain | grep -F "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)-"
          cargo --version
          cargo clippy --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests, including the recorded-artifact check
        run: cargo test --release --locked
      - name: Planted-bug tests (compile-time planted-bugs feature; recording commands refuse to run in this build)
        run: |
          cargo clippy --all-targets --locked --features planted-bugs -- -D warnings
          cargo test --release --locked --features planted-bugs --test planted_build --test serving_kv --test serving_engine --test serving_faults
      - name: Independent Python Fraction vectors are current
        run: |
          python3 -I scripts/gen_sum_vectors.py > /tmp/exact-sums.txt
          cmp /tmp/exact-sums.txt tests/vectors/exact-sums.txt
      - name: Independent Python shard-tree vectors are current
        run: |
          python3 -I scripts/gen_tree_vectors.py > /tmp/tree-sums.txt
          cmp /tmp/tree-sums.txt tests/vectors/tree-sums.txt
