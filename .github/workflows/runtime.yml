name: Runtime (Rust)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in runtime/rust-toolchain.toml (preinstalled rustup, no third-party action)
        run: |
          rustup toolchain install
          rustup show active-toolchain | grep -F "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)-"
          cargo --version
          cargo clippy --version
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests, including the recorded-artifact checks (the slow trained-model stale tests run in runtime-trained.yml)
        run: cargo test --release --locked
      - name: Planted-bug tests (compile-time planted-bugs feature; recording commands refuse to run in this build)
        run: |
          cargo clippy --all-targets --locked --features planted-bugs -- -D warnings
          cargo test --release --locked --features planted-bugs --test planted_build --test serving_kv --test serving_engine --test serving_faults --test decoder_planted --test precision_planted --test dataflow_planted --test association_planted --test train_planted --test narrow_planted
      - name: Independent Python Fraction vectors are current
        run: |
          python3 -I scripts/gen_sum_vectors.py > /tmp/exact-sums.txt
          cmp /tmp/exact-sums.txt tests/vectors/exact-sums.txt
      - name: Independent Python shard-tree vectors are current
        run: |
          python3 -I scripts/gen_tree_vectors.py > /tmp/tree-sums.txt
          cmp /tmp/tree-sums.txt tests/vectors/tree-sums.txt
      - name: Independent Python decoder vectors are current
        run: |
          python3 -I scripts/gen_decoder_vectors.py > /tmp/decoder.txt
          cmp /tmp/decoder.txt tests/vectors/decoder.txt
      - name: Independent Python fused-chain vectors are current
        run: |
          python3 -I scripts/gen_chain_vectors.py > /tmp/chain-dots.txt
          cmp /tmp/chain-dots.txt tests/vectors/chain-dots.txt
      - name: Independent Python FP8/INT8 vectors are current
        run: |
          python3 -I scripts/gen_narrow_vectors.py > /tmp/narrow.txt
          cmp /tmp/narrow.txt tests/vectors/narrow.txt
      - name: Trained weights match the pinned SHA-256 (independent hashlib check; the tests above retrain and compare)
        run: |
          pinned=$(sed -n 's/^pub const TRAINED_WEIGHTS_SHA256: &str = "\([0-9a-f]*\)";$/\1/p' src/train/mod.rs)
          actual=$(python3 -I -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" results/r4-trained-weights.bin)
          echo "pinned $pinned, file $actual"
          test -n "$pinned" && test "$pinned" = "$actual"
