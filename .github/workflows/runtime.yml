name: Runtime (Rust)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain (preinstalled rustup, no third-party action)
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup default 1.97.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests, including the recorded-artifact check
        run: cargo test --release --locked
      - name: Independent Python Fraction vectors are current
        run: |
          python3 -I scripts/gen_sum_vectors.py > /tmp/exact-sums.txt
          cmp /tmp/exact-sums.txt tests/vectors/exact-sums.txt
