name: RTL verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.9.0'
          cache: npm
      - run: npm ci
      - name: Install distribution RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y verilator yosys
          verilator --version
          yosys -V
      - name: Strict RTL lint, build, and complete differential corpus
        run: make -C rtl test
      - name: Directed waveform capture
        run: make -C rtl waveform
      - name: Multiply and true FMA differential corpus
        run: make -C rtl -f mul-fma.mk test
      - name: Multiply and FMA directed waveform
        run: make -C rtl -f mul-fma.mk waveform
      - name: Generic synthesis sanity checks
        run: make -C rtl -f mul-fma.mk synth
