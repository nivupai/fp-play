name: RTL verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verilator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.9.0'
          cache: npm
      - run: npm ci
      - name: Install distribution Verilator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y verilator
          verilator --version
      - name: Strict RTL lint, build, and complete differential corpus
        run: make -C rtl test
      - name: Directed waveform capture
        run: make -C rtl waveform
      - name: Multiply and true FMA differential corpus
        run: make -C rtl -f mul-fma.mk test
      - name: Multiply and FMA directed waveform
        run: make -C rtl -f mul-fma.mk waveform
      - name: Install pinned synthesis toolchain
        env:
          OSS_CAD_SHA256: f33dc250de5e3d2b4325c32dafc695c44e4f19cdc1e3bdb1fea7c78a7c5daa0a
        run: |
          archive="$RUNNER_TEMP/oss-cad-suite-linux-x64-20261024.tgz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-10-24/oss-cad-suite-linux-x64-20261024.tgz
          printf '%s  %s\n' "$OSS_CAD_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          version="$("$RUNNER_TEMP/oss-cad-suite/bin/yosys" -V)"
          printf '%s\n' "$version"
          case "$version" in
            'Yosys 0.70+219 (git sha1 5053d0e26,'*) ;;
            *) echo 'Unexpected synthesis tool version' >&2; exit 1 ;;
          esac
      - name: Generic synthesis sanity checks
        run: make -C rtl -f mul-fma.mk synth YOSYS="$RUNNER_TEMP/oss-cad-suite/bin/yosys"
