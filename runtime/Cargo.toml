[package]
name = "fp-play-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "FP Play runtime: exact simulation of multi-device collectives and their numerical effects"
license = "MIT"
publish = false

# Deliberately dependency-free: every number in the recorded artifacts comes from
# code in this crate, and builds work offline.
[dependencies]

[features]
# Compiles in the deliberate bugs that the planted-bug tests switch on. Off by
# default; the `experiment` and `traces` commands refuse to run when it is on,
# so no recorded artifact can come from a build with planted bugs.
planted-bugs = []

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
